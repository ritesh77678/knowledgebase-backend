version: '16.11-alpine3.23'

services:
  postgres:
    image: postgres
    container_name: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ritesh
      POSTGRES_PASSWORD: ritesh
      POSTGRES_DB: knowledgebase
    volumes:
      - postgres-data:/var/lib/postgresql/

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    command: >
      redis-server
      --appendonly yes
      --requirepass redispassword
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
